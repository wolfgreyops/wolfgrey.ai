<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>AI Tip Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 675px;
    overflow: hidden;
    background: #050810;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1140px;
    height: 615px;
    background: #111827;
    border: 1px solid rgba(30,41,64,0.8);
    border-radius: 16px;
    padding: 48px 48px 40px 56px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 60px rgba(0,0,0,0.4), 0 0 80px rgba(0,229,204,0.06);
  }
  /* Top glow */
  .card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100%;
    background: linear-gradient(180deg, rgba(0,229,204,0.06) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }
  /* Gradient accent bar */
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(to bottom, #00e5cc, transparent);
    border-radius: 16px 0 0 16px;
    z-index: 2;
  }
  .label {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 13px;
    color: #00e5cc;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 0;
    position: relative;
    z-index: 1;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 44px;
    font-weight: 400;
    color: #f0f4ff;
    line-height: 1.2;
    margin-bottom: 24px;
  }
  .body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 21px;
    color: #a8b2d1;
    line-height: 1.7;
    max-width: 880px;
  }
  .footer {
    display: flex;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .logo-lockup {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    height: 40px;
    width: auto;
    filter: brightness(0) invert(1);
  }
  .wordmark {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 18px;
    color: #5a6480;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

    <div class="accent-bar"></div>
    <div class="label">AI TIP</div>
    <div class="content">
      <div class="title">{{TITLE}}</div>
      <div class="body">{{BODY}}</div>
    </div>
